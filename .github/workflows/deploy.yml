name: Build and Push Docker Image to ACR

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Git SHA Output
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: acrcampussphere-ace2hqbbdraxc9fe.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            acrcampussphere-ace2hqbbdraxc9fe.azurecr.io/campussphere-server:${{ steps.vars.outputs.sha }}
            acrcampussphere-ace2hqbbdraxc9fe.azurecr.io/campussphere-server:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Image to Azure Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name app-campussphere-server \
              --resource-group rg-campussphere-prod \
              --container-name app-campussphere-server \
              --image acrcampussphere-ace2hqbbdraxc9fe.azurecr.io/campussphere-server:${{ steps.vars.outputs.sha }}

