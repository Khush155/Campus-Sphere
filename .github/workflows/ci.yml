name: CampusSphere CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache MongoDB Binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-6.0.14

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Lint Code
        run: |
          npm run lint --prefix server
          npm run lint --prefix client

      - name: Run Backend Tests
        run: npm run test --prefix server
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: supersecretjwtkeyforlocaltestsonly
          JWT_REFRESH_SECRET: supersecretrefreshjwtkeyforlocaltestsonly
          NODE_ENV: test
          MONGOMS_VERSION: "6.0.14"
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
